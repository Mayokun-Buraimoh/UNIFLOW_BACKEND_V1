# Render Blueprint — UniFlow Node API (Docker + LibreOffice)
# Docs: https://render.com/docs/blueprint-spec
#
# After linking the repo, set secrets in the dashboard (never commit them):
#   DATABASE_URL, JWT_SECRET, CLOUDINARY_URL, GOOGLE_*, OPENAI_API_KEY, INTERNAL_API_KEY

services:
  - type: web
    name: uniflow-backend
    runtime: docker
    region: oregon
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # Link Postgres in Render dashboard or add a database block below.
      - key: DATABASE_URL
        fromDatabase:
          name: uniflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_IOS_CLIENT_ID
        sync: false
      - key: FRONTEND_GOOGLE_REDIRECT_URI
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DISABLE_EVENT_REMINDERS
        value: "true"

databases:
  - name: uniflow-db
    plan: free
    databaseName: uniflow
    user: uniflow
